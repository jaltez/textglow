[package]
name = "textglow"
version = "0.1.0"
edition = "2021"
description = "Selection-aware AI text 'glow up' popup: tray-resident, global hotkey, OpenAI-compatible providers"
license = "MIT"

[dependencies]
eframe = "0.36"
egui = "0.36"
global-hotkey = "0.8"
tray-icon = "0.25"
arboard = "3"
enigo = "0.6"
device_query = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
keyring = { version = "4", features = ["v1"] }
auto-launch = "0.6"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[profile.release]
lto = true
strip = true
opt-level = "s"
